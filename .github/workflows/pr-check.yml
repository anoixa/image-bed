name: PR Check & Auto Merge

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  # ==========================
  # Lint & Security
  # ==========================
  lint:
    name: Code Linting
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: Install native deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libvips-dev \
            pkg-config \
            libsqlite3-dev

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.10.1
          args: --timeout=5m

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # ==========================
  # Tests
  # ==========================
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: Install libvips
        run: |
          sudo apt-get update
          sudo apt-get install -y libvips-dev

      - name: Run tests
        run: |
          go test -v -race -shuffle=on \
            -coverprofile=coverage.out ./...

      - name: Coverage Report
        run: go tool cover -func=coverage.out

  # ==========================
  # Docker Verify AMD64
  # ==========================
  docker-verify-amd64:
    name: Docker Verify (amd64)
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - uses: actions/checkout@v6

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image (amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: image-bed:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================
  # Docker Verify ARM64
  # ==========================
  docker-verify-arm64:
    name: Docker Verify (arm64)
    runs-on: ubuntu-24.04-arm
    needs: [lint, test]

    steps:
      - uses: actions/checkout@v6

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image (arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: false
          tags: image-bed:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================
  # Release Image Smoke Test
  # ==========================
  docker-smoke:
    name: Release Image Smoke Test
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - uses: actions/checkout@v6

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4

      # Build with the same release args the release workflow uses, and load
      # the image locally so we can actually run it.
      - name: Build release image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: image-bed:smoke
          build-args: |
            VERSION=release
            COMMIT_HASH=${{ github.sha }}
          cache-from: type=gha

      - name: Run container
        run: docker run -d --name ib-smoke -p 8080:8080 image-bed:smoke

      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/system/health >/dev/null 2>&1; then
              echo "healthy after ~$((i*2))s"; exit 0
            fi
            sleep 2
          done
          echo "::error::container did not become healthy"
          docker logs ib-smoke
          exit 1

      # The original high-risk regression: a release image silently running in
      # development mode (pprof/Swagger exposed, non-Secure auth cookies).
      - name: Assert production mode (version, pprof, swagger)
        run: |
          set -eu
          version_body=$(curl -fsS http://localhost:8080/system/version)
          echo "version: $version_body"
          echo "$version_body" | grep -q '"version":"release"' \
            || { echo "::error::version endpoint did not report release"; exit 1; }

          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/debug/pprof/heap)
          [ "$code" = "404" ] \
            || { echo "::error::/debug/pprof/heap returned $code, expected 404"; exit 1; }

          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/swagger/index.html)
          [ "$code" = "404" ] \
            || { echo "::error::/swagger/index.html returned $code, expected 404"; exit 1; }
          echo "production routes OK"

      - name: Assert auth cookies are Secure
        run: |
          set -eu
          pw=$(docker logs ib-smoke 2>&1 | grep '密码:' | sed -E 's/.*密码:[[:space:]]*//' | tr -d '\r' | head -n1)
          [ -n "$pw" ] || { echo "::error::could not extract admin password from logs"; docker logs ib-smoke; exit 1; }
          headers=$(curl -s -i -X POST http://localhost:8080/api/auth/login \
            -H 'Content-Type: application/json' \
            -d "{\"username\":\"admin\",\"password\":\"${pw}\"}")
          echo "$headers" | grep -i '^set-cookie:.*refresh_token' | grep -qi 'Secure' \
            || { echo "::error::refresh_token cookie missing Secure attribute"; echo "$headers"; exit 1; }
          echo "Secure cookie OK"

      - name: Cleanup
        if: always()
        run: docker rm -f ib-smoke || true

  # ==========================
  # Auto Merge
  # ==========================
  auto-merge:
    name: Auto Merge PR
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
      - docker-verify-amd64
      - docker-verify-arm64
      - docker-smoke

    if: |
      github.event.pull_request.user.login == 'anoixa' &&
      github.event.pull_request.draft == false &&
      !contains(github.event.pull_request.title, 'WIP') &&
      !contains(github.event.pull_request.title, '[wip]')

    steps:
      - name: Merge PR
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            console.log(`Merging PR #${pr.number}`);

            await github.rest.pulls.merge({
              owner,
              repo,
              pull_number: pr.number,
              merge_method: 'merge'
            });

            console.log(`PR #${pr.number} merged successfully`);

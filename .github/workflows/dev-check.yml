name: Dev CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  ########################################
  # Lint + Security
  ########################################
  lint:
    name: Lint & Security Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
      - name: Install native deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libvips-dev \
            libheif-dev \
            libheif-plugin-aomenc \
            libheif-plugin-aomdec \
            pkg-config \
            libsqlite3-dev
      - run: |
          go mod download
          go mod verify
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.10.1
          args: --timeout=5m
      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  ########################################
  # Tests
  ########################################
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
      - name: Install libvips
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libvips-dev \
            libheif-dev \
            libheif-plugin-aomenc \
            libheif-plugin-aomdec \
            pkg-config \
            libsqlite3-dev
      - run: go mod download
      - name: Run tests
        run: |
          go test -v -race -shuffle=on -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out

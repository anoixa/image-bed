name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        type: string
      frontend_ref:
        description: 'Frontend (image-bed-web) full 40-character commit SHA to build'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: write
  packages: write

jobs:
  ########################################
  # Lint + Security
  ########################################
  lint:
    name: Lint & Security Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
      - name: Install native deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libvips-dev \
            libheif-dev \
            libheif-plugin-aomenc \
            libheif-plugin-aomdec \
            pkg-config \
            libsqlite3-dev
      - run: |
          go mod download
          go mod verify
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.10.1
          args: --timeout=5m
      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  ########################################
  # Test
  ########################################
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install native deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libvips-dev \
            libheif-dev \
            libheif-plugin-aomenc \
            libheif-plugin-aomdec \
            pkg-config \
            libsqlite3-dev

      - run: go mod download
      - run: go test -v -race -shuffle=on ./...

  ########################################
  # Build Frontend
  ########################################
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Validate pinned frontend commit
        env:
          FRONTEND_REF: ${{ inputs.frontend_ref }}
        run: |
          if [[ ! "$FRONTEND_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "frontend_ref must be a full 40-character commit SHA" >&2
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          repository: anoixa/image-bed-web
          ref: ${{ inputs.frontend_ref }}

      - name: Record resolved frontend commit
        id: resolve
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install and build
        run: |
          npm ci
          npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: dist/
          retention-days: 1

  ########################################
  # Build Binary AMD64
  ########################################
  build-binary-amd64:
    name: Binary (amd64)
    runs-on: ubuntu-latest
    needs: [lint, test, build-frontend]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: public/dist/

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install libvips
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libvips-dev \
            libheif-dev \
            libheif-plugin-aomenc \
            libheif-plugin-aomdec \
            pkg-config

      - name: Build
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 1
          VERSION: "release"
        run: |
          go build -trimpath \
            -ldflags="-s -w \
            -X 'github.com/anoixa/image-bed/config.Version=${VERSION}' \
            -X 'github.com/anoixa/image-bed/config.CommitHash=${GITHUB_SHA}'" \
            -o image-bed-linux-amd64 .

      - uses: actions/upload-artifact@v7
        with:
          name: image-bed-linux-amd64
          path: image-bed-linux-amd64

  ########################################
  # Build Binary ARM64
  ########################################
  build-binary-arm64:
    name: Binary (arm64)
    runs-on: ubuntu-24.04-arm
    needs: [lint, test, build-frontend]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: public/dist/

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install libvips
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libvips-dev \
            libheif-dev \
            libheif-plugin-aomenc \
            libheif-plugin-aomdec \
            pkg-config

      - name: Build
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: 1
          VERSION: "release"
        run: |
          go build -trimpath \
            -ldflags="-s -w \
            -X 'github.com/anoixa/image-bed/config.Version=${VERSION}' \
            -X 'github.com/anoixa/image-bed/config.CommitHash=${GITHUB_SHA}'" \
            -o image-bed-linux-arm64 .

      - uses: actions/upload-artifact@v7
        with:
          name: image-bed-linux-arm64
          path: image-bed-linux-arm64

  ########################################
  # Docker AMD64
  ########################################
  docker-amd64:
    name: Docker (amd64)
    runs-on: ubuntu-latest
    needs: [lint, test, build-frontend]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: public/dist/

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push
        env:
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

          docker buildx build \
            --platform linux/amd64 \
            --build-arg VERSION=release \
            --build-arg COMMIT_HASH=${GITHUB_SHA} \
            -t ${IMAGE}:${RELEASE_TAG}-amd64 \
            -t ${IMAGE}:latest-amd64 \
            --push .

  ########################################
  # Docker ARM64
  ########################################
  docker-arm64:
    name: Docker (arm64)
    runs-on: ubuntu-24.04-arm
    needs: [lint, test, build-frontend]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: public/dist/

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push
        env:
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

          docker buildx build \
            --platform linux/arm64 \
            --build-arg VERSION=release \
            --build-arg COMMIT_HASH=${GITHUB_SHA} \
            -t ${IMAGE}:${RELEASE_TAG}-arm64 \
            -t ${IMAGE}:latest-arm64 \
            --push .

  ########################################
  # Multi Arch
  ########################################
  docker-multi:
    name: Multi-Arch Manifest
    runs-on: ubuntu-latest
    needs: [docker-amd64, docker-arm64]

    steps:
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest
        env:
          VERSION: ${{ inputs.version }}
        run: |
          IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

          docker buildx imagetools create \
            -t ${IMAGE}:${VERSION} \
            -t ${IMAGE}:latest \
            ${IMAGE}:${VERSION}-amd64 \
            ${IMAGE}:${VERSION}-arm64

  ########################################
  # GitHub Release
  ########################################
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [docker-multi, build-binary-amd64, build-binary-arm64, build-frontend]

    steps:
      - uses: actions/checkout@v6

      - name: Download binaries
        uses: actions/download-artifact@v8

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
          FRONTEND_REF: ${{ inputs.frontend_ref }}
          FRONTEND_SHA: ${{ needs.build-frontend.outputs.sha }}
        run: |
          prerelease_flag=""
          if [ "$PRERELEASE" = "true" ]; then
            prerelease_flag="--prerelease"
          fi

          # Record the requested and resolved commit for release provenance.
          notes=$(printf 'Frontend (image-bed-web): `%s` @ %s' "$FRONTEND_REF" "$FRONTEND_SHA")

          gh release create "$RELEASE_VERSION" \
            image-bed-linux-amd64/image-bed-linux-amd64 \
            image-bed-linux-arm64/image-bed-linux-arm64 \
            --title "$RELEASE_VERSION" \
            --target "$GITHUB_SHA" \
            --notes "$notes" \
            $prerelease_flag
